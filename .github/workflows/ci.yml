name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spine
          POSTGRES_PASSWORD: spine
          POSTGRES_DB: spine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spine -d spine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPINE_TEST_DATABASE_URL: postgresql://spine:spine@localhost:5432/spine_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: make test
      - run: make bench-check
